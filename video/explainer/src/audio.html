<!doctype html>
<html><head><meta charset="utf-8"><title>Tally explainer audio</title></head>
<body>
<script src="timeline.js"></script>
<script src="captions-timing.js"></script>
<script>
// Procedural bed and cues, rendered offline from the same TIMELINE. Tempo-locked at bed.bpm, one
// motif (D F# A D) that returns on the key idea and the payoff. Ducks under every voice line.
// window.renderAudio() resolves to a base64 16-bit WAV, 48 kHz stereo, TIMELINE.duration seconds.
window.renderAudio = async function renderAudio() {
  const sr = 48000, dur = TIMELINE.duration
  const ctx = new OfflineAudioContext(2, Math.ceil(sr * dur), sr)
  const master = ctx.createGain(); master.gain.value = 1; master.connect(ctx.destination)

  // Seeded randomness only.
  let seed = 7
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296 }

  const beat = 60 / TIMELINE.bed.bpm
  const root = TIMELINE.bed.root
  const semi = n => root * Math.pow(2, n / 12)

  // Bed bus: ducked under voice.
  const bed = ctx.createGain(); bed.gain.value = 1
  const bedLp = ctx.createBiquadFilter(); bedLp.type = 'lowpass'; bedLp.frequency.value = 1400; bedLp.Q.value = 0.4
  bed.connect(bedLp); bedLp.connect(master)
  const captions = (window.CAPTIONS_TIMING && window.CAPTIONS_TIMING.length) ? window.CAPTIONS_TIMING : TIMELINE.captions
  const g = bed.gain
  g.setValueAtTime(1, 0)
  for (const c of captions) {
    g.setTargetAtTime(0.42, Math.max(0, c.t0 - 0.25), 0.08)
    g.setTargetAtTime(1, c.t1 + 0.15, 0.35)
  }
  // Fade in and out.
  const fadeIn = ctx.createGain(); fadeIn.gain.setValueAtTime(0, 0); fadeIn.gain.linearRampToValueAtTime(1, 1.2)
  fadeIn.gain.setValueAtTime(1, dur - 2.5); fadeIn.gain.linearRampToValueAtTime(0, dur - 0.05)
  const bedIn = ctx.createGain(); bedIn.connect(fadeIn); fadeIn.connect(bed)

  // Pad: two detuned triangles per note, slow chord changes every 8 beats (D, Bm, G, A).
  const chords = [[0, 7, 12, 16], [-3, 4, 9, 14], [-7, 0, 7, 12], [-5, 4, 9, 11]]
  const padGain = ctx.createGain(); padGain.gain.value = 0.045; padGain.connect(bedIn)
  const chordLen = beat * 8
  for (let i = 0; i * chordLen < dur; i++) {
    const notes = chords[i % chords.length]
    const t0 = i * chordLen, t1 = Math.min(dur, t0 + chordLen)
    for (const n of notes) {
      for (const det of [-4, 4]) {
        const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = semi(n); o.detune.value = det
        const env = ctx.createGain(); env.gain.setValueAtTime(0, t0); env.gain.linearRampToValueAtTime(1, t0 + 1.4); env.gain.setValueAtTime(1, t1 - 1.2); env.gain.linearRampToValueAtTime(0, t1)
        o.connect(env); env.connect(padGain); o.start(t0); o.stop(t1 + 0.05)
      }
    }
  }
  // Pulse: a soft filtered tick on every beat, lighter off the downbeat.
  const pulseGain = ctx.createGain(); pulseGain.gain.value = 0.16; pulseGain.connect(bedIn)
  const noiseBuf = ctx.createBuffer(1, sr * 0.06, sr)
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = (rnd() * 2 - 1) * Math.pow(1 - i / nd.length, 3)
  for (let b = 0; b * beat < dur - 2; b++) {
    const t = b * beat + 0.02
    const src = ctx.createBufferSource(); src.buffer = noiseBuf
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = b % 4 === 0 ? 900 : 1600; bp.Q.value = 6
    const env = ctx.createGain(); env.gain.value = b % 4 === 0 ? 1 : 0.45
    src.connect(bp); bp.connect(env); env.connect(pulseGain); src.start(t)
  }
  // Bass: root on the downbeat of each chord, very quiet.
  const bassGain = ctx.createGain(); bassGain.gain.value = 0.06; bassGain.connect(bedIn)
  for (let i = 0; i * chordLen < dur - 2; i++) {
    const t0 = i * chordLen
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = semi(chords[i % chords.length][0]) / 2
    const env = ctx.createGain(); env.gain.setValueAtTime(0, t0); env.gain.linearRampToValueAtTime(1, t0 + 0.05); env.gain.exponentialRampToValueAtTime(0.001, t0 + chordLen - 0.1)
    o.connect(env); env.connect(bassGain); o.start(t0); o.stop(t0 + chordLen)
  }

  // Cues: on the master, not ducked, all soft.
  const cueGain = ctx.createGain(); cueGain.gain.value = 1; cueGain.connect(master)
  function tone(t, f, len, vol, type, to) {
    const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t)
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + len)
    const env = ctx.createGain(); env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(vol, t + 0.008); env.gain.exponentialRampToValueAtTime(0.0005, t + len)
    o.connect(env); env.connect(cueGain); o.start(t); o.stop(t + len + 0.02)
  }
  function click(t, f, vol) {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 4
    const env = ctx.createGain(); env.gain.value = vol
    src.connect(bp); bp.connect(env); env.connect(cueGain); src.start(t)
  }
  const motif = (t, vol) => TIMELINE.bed.motif.forEach((n, i) => tone(t + i * beat * 0.5, semi(n + 12), 0.9, vol, 'triangle'))
  for (const c of TIMELINE.cues) {
    switch (c.kind) {
      case 'pop': tone(c.t, 740, 0.16, 0.16, 'sine', 520); break
      case 'form': tone(c.t, 220, 0.5, 0.07, 'triangle', 180); break
      case 'read': tone(c.t, 440, 1.2, 0.05, 'sine', 660); break
      case 'dock': click(c.t, 2400, 0.35); tone(c.t, 880, 0.12, 0.05); break
      case 'tick': click(c.t, 3200, 0.3); tone(c.t, 1320, 0.08, 0.05); break
      case 'confirm': tone(c.t, 660, 0.25, 0.1); tone(c.t + 0.12, 880, 0.4, 0.1); break
      case 'hold': tone(c.t, 330, 0.6, 0.09, 'triangle', 300); break
      case 'motif': motif(c.t, 0.11); break
    }
  }

  const buf = await ctx.startRendering()
  // Interleave to 16-bit PCM WAV.
  const ch = buf.numberOfChannels, n = buf.length
  const out = new DataView(new ArrayBuffer(44 + n * ch * 2))
  const str = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)) }
  str(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); str(8, 'WAVE'); str(12, 'fmt '); out.setUint32(16, 16, true)
  out.setUint16(20, 1, true); out.setUint16(22, ch, true); out.setUint32(24, sr, true); out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true)
  str(36, 'data'); out.setUint32(40, n * ch * 2, true)
  const chans = []; for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c))
  let p = 44
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const v = Math.max(-1, Math.min(1, chans[c][i])); out.setInt16(p, v < 0 ? v * 32768 : v * 32767, true); p += 2 }
  const bytes = new Uint8Array(out.buffer)
  let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000))
  return btoa(bin)
}
</script>
</body></html>
